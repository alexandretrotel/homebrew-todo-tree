name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: brew install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-13, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Homebrew
        if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@master

      - name: Tap and install
        run: |
          brew tap alexandretrotel/todo-tree "$PWD"
          brew install --verbose alexandretrotel/todo-tree/todo-tree

      - name: Run brew test
        run: brew test alexandretrotel/todo-tree/todo-tree

      - name: Run brew audit
        run: brew audit --strict --online alexandretrotel/todo-tree/todo-tree

      - name: Check binaries work
        run: |
          todo-tree --version
          tt --version
